# Proxy sitemap endpoints from tarkam.fun to the dedicated Railway sitemap service.
# Replace the upstream host below with your actual Railway public domain if needed.

location = /sitemap.xml {
    proxy_pass https://tarkam-sitemap-production.up.railway.app/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
    proxy_connect_timeout 30;
}

location = /sitemap-plain.xml {
    proxy_pass https://tarkam-sitemap-production.up.railway.app/sitemap-plain.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
    proxy_connect_timeout 30;
}

location = /health-sitemap {
    proxy_pass https://tarkam-sitemap-production.up.railway.app/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30;
    proxy_connect_timeout 15;
}
