server {
    listen 80;
    listen [::]:80;
    server_name tarkam.fun www.tarkam.fun;

    client_max_body_size 20m;

    # Replace these upstreams with your actual public Railway domains.
    # Example:
    # - frontend: https://tarkam-web-production.up.railway.app
    # - sitemap : https://tarkam-sitemap-production.up.railway.app

    location = /sitemap.xml {
        proxy_pass https://tarkam-sitemap-production.up.railway.app/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 30;
    }

    location = /sitemap-plain.xml {
        proxy_pass https://tarkam-sitemap-production.up.railway.app/sitemap-plain.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 30;
    }

    location = /health-sitemap {
        proxy_pass https://tarkam-sitemap-production.up.railway.app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_connect_timeout 15;
    }

    location / {
        proxy_pass https://tarkam-web-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
    }
}
